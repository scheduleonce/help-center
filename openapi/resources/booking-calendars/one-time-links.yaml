booking-calendars--id--one-time-links:
  post:
    tags:
      - "Booking Calendars"
    summary: Create a one-time link
    description: |
      Creates a one time link for a Booking Calendar.

      > [!note]
      > One-time links are only available for published booking calendars.

      > [!important]
      > One-time links that haven't been consumed will be automatically deleted after 90 days.
    operationId: booking-calendars-create-a-one-time-link
    parameters:
      - name: id
        in: path
        description: ID of the booking calendar
        schema:
          type: string
        required: true
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              hide_url_params:
                type: boolean
                description: When set to `true`, the API generates a short one-time-use link with no visible query parameters.
                default: true
              booking_form:
                $ref: "../../components/schemas/booking-form.yaml#/BookingForm"
              utm_params:
                $ref: "../../components/schemas/utm-params.yaml#/UtmParams"
              booking_settings:
                type: object
                x-propertyOrder:
                  - host
                  - co_hosts
                  - duration_minutes
                  - skip
                description: Settings for the booking calendar when the one-time link is used.
                properties:
                  host:
                    type: string
                    description: The email of the team member who should host the booking. Only supported on team booking calendars. If the host is not a part of the team or doesn't have a license, the host is ignored and the distribution method continues as configured.
                  co_hosts:
                    type: string
                    description: A comma-separated list of email addresses for co-hosts to be added to the booking. All co-hosts must share the same OnceHub account, possess an active license, and must not be deleted. Multiple email addresses should be separated strictly by commas (e.g., `cohost1@example.com,cohost2@example.com`).
                  duration_minutes:
                    type: integer
                    description: The meeting duration in minutes. Must be one of the durations configured in the booking calendar settings. When set, the guest cannot change the duration.
                  skip:
                    type: array
                    items:
                      type: string
                    description: List of booking flow steps to skip (e.g., contact_info, questions, co_hosts).
            example:
              booking_form:
                name: "Carrie Customer"
                email: "carrie.customer@example.com"
              utm_params:
                source: "facebook"
                medium: "social"
                campaign: "webinar_signup"
                term: "onlinemeeting+scheduler"
                content: "logolink"
              booking_settings:
                host: "teamlead@example.com"
                co_hosts: "cohost3@example.com,cohost4@example.com"
                duration_minutes: 30
                skip: ["contact_info"]
    responses:
      "401":
        $ref: "../../components/responses/errors.yaml#/Unauthorized"
      "429":
        $ref: "../../components/responses/errors.yaml#/TooManyRequests"
      "200":
        description: "200"
        content:
          application/json:
            examples:
              Result:
                value:
                  id: QUHVEKLPD93M
                  url: https://oncehub.com/.QUHVEKLPD93M
                  creation_time: "2024-06-18T14:28:19Z"
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: QUHVEKLPD93M
                url:
                  type: string
                  example: https://oncehub.com/.QUHVEKLPD93M
                creation_time:
                  type: string
                  example: "2024-06-18T14:28:19Z"
      "400":
        description: "400"
        content:
          application/json:
            examples:
              Result:
                value:
                  type: "invalid_request_error"
                  message: "This booking calendar does not allow creation of one time links: 'BKC-1234'"
                  param: id
            schema:
              $ref: "../../components/schemas/common.yaml#/Error"
      "404":
        description: "404"
        content:
          application/json:
            examples:
              Result:
                value:
                  type: invalid_request_error
                  message: "No such booking calendar: '123'"
                  param: id
            schema:
              $ref: "../../components/schemas/common.yaml#/Error"
    deprecated: false
