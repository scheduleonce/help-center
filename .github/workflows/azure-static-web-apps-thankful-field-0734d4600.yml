# ==============================================================================
# ENVIRONMENT: DEV / STAGING
# Branch: dev
# Domain: https://help.staticso2.com
# Azure Resource: thankful-field-0734d4600
# ==============================================================================
name: Azure Static Web Apps CI/CD (DEV - help.staticso2.com)

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - dev

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Validate OpenAPI
        run: pnpm run openapi:validate
      - run: pnpm run build
        env:
          SITE_URL: https://help.staticso2.com
      - name: Inject noindex headers for dev deployment
        run: |
          node -e '
            const fs = require("fs");
            const file = "dist/staticwebapp.config.json";
            if (fs.existsSync(file)) {
              const cfg = JSON.parse(fs.readFileSync(file, "utf8"));
              cfg.globalHeaders = cfg.globalHeaders || {};
              cfg.globalHeaders["X-Robots-Tag"] = "noindex, nofollow, noarchive";
              fs.writeFileSync(file, JSON.stringify(cfg, null, 2));
              console.log("[CI] Injected X-Robots-Tag: noindex, nofollow, noarchive into dist/staticwebapp.config.json");
            } else {
              console.error("[CI] dist/staticwebapp.config.json not found!");
              process.exit(1);
            }
          '
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_FIELD_0734D4600 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_FIELD_0734D4600 }}
          action: "close"
